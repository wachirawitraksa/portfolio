name: portfolio

services:
  caddy:
    image: caddy:2
    container_name: portfolio-proxy
    ports: ["${HTTP_PORT:-80}:80"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api]

  web:
    build: ./web
    container_name: portfolio-web
    environment:
      API_INTERNAL_URL: http://api:8000
    # Dev only: direct access, bypasses the proxy. Localhost only.
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]

  api:
    build: ./api
    container_name: portfolio-api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    # Dev only: direct access (Swagger at /docs). Localhost only.
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  db:
    image: pgvector/pgvector:pg16
    container_name: portfolio-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Dev only: connect from a DB client. Localhost only.
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      retries: 20

  # Object storage removed: MinIO images are not pullable anymore (401 on quay.io, gone from Docker Hub).
  # Nothing uses S3 yet. Pick a replacement (SeaweedFS / Garage / RustFS) when image upload is built.

volumes:
  db-data:
