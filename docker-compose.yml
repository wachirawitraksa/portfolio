name: portfolio

services:
  caddy:
    image: caddy:2
    container_name: portfolio-proxy
    ports: ["${HTTP_PORT:-80}:80"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api]

  web:
    build: ./web
    container_name: portfolio-web
    environment:
      API_INTERNAL_URL: http://api:8000
    # Dev only: direct access, bypasses the proxy. Localhost only.
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]

  api:
    build: ./api
    container_name: portfolio-api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    # Dev only: direct access (Swagger at /docs). Localhost only.
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  db:
    image: pgvector/pgvector:pg16
    container_name: portfolio-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Dev only: connect from a DB client. Localhost only.
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      retries: 20

  # S3-compatible object storage (RustFS replaces MinIO, whose images are no longer pullable).
  # The API reads S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET, so a real S3 service drops in later.
  storage:
    image: rustfs/rustfs:1.0.3
    container_name: portfolio-storage
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    command: /data
    volumes:
      - storage-data:/data
    # Dev only: S3 API for debugging. Localhost only. Images reach browsers through the API, not directly.
    ports: ["127.0.0.1:${S3_PORT:-9000}:9000"]

volumes:
  db-data:
  storage-data:
