name: portfolio

services:
  caddy:
    image: caddy:2
    container_name: portfolio-proxy
    ports: ["${HTTP_PORT:-80}:80"]
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on: [web, api]

  web:
    build: ./web
    container_name: portfolio-web
    environment:
      API_INTERNAL_URL: http://api:8000
      # Used for absolute URLs (link previews, sitemap). Set SITE_URL in .env for https or a different address.
      SITE_URL: ${SITE_URL:-http://${SITE_DOMAIN}}
    # Healthy when the site answers. robots.txt is a plain page that does not call the API, so this says "the web
    # server is alive", and /api/health says whether the API and its database are.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/robots.txt').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
    # Dev only: direct access, bypasses the proxy. Localhost only.
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]

  api:
    build: ./api
    container_name: portfolio-api
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    # Healthy when /api/health answers 200: the database and the file storage both respond.
    # (The image has no curl, so Python makes the request; a 503 raises and fails the check.)
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 30s
    # Dev only: direct access (Swagger at /docs). Localhost only.
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]

  db:
    image: pgvector/pgvector:pg16
    container_name: portfolio-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    # Dev only: connect from a DB client. Localhost only.
    ports: ["127.0.0.1:${DB_PORT:-5433}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 3s
      retries: 20

  # S3-compatible object storage (RustFS replaces MinIO, whose images are no longer pullable).
  # The API reads S3_ENDPOINT / S3_ACCESS_KEY / S3_SECRET_KEY / S3_BUCKET, so a real S3 service drops in later.
  storage:
    image: rustfs/rustfs:1.0.3
    container_name: portfolio-storage
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
    command: /data
    volumes:
      - storage-data:/data
    # Dev only: S3 API for debugging. Localhost only. Images reach browsers through the API, not directly.
    ports: ["127.0.0.1:${S3_PORT:-9100}:9000"]

  # Optional uptime monitor with alerts (Discord, Telegram, email ...): `docker compose --profile monitor up -d`,
  # then open http://localhost:${MONITOR_PORT:-3001} and follow OPERATIONS.md. Off by default.
  monitor:
    profiles: ["monitor"]
    image: louislam/uptime-kuma:2.5.6
    container_name: portfolio-monitor
    restart: unless-stopped
    volumes:
      - monitor-data:/app/data
    # Local only. Put it behind the proxy with its own password before ever exposing it.
    ports: ["127.0.0.1:${MONITOR_PORT:-3001}:3001"]

volumes:
  monitor-data:
  db-data:
  storage-data:
