# Runs on every push to main and on every pull request. It does what is done by hand before a release:
# the API tests, the web type check and build, and a build of both Docker images.
# Actions are pinned to a commit (the tag is in the comment) so a moved tag cannot change what runs.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API tests and admin stylesheet
    runs-on: ubuntu-24.04
    services:
      postgres:
        # The tests need the pgvector and pg_trgm extensions; the tests create their own tables in this database.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: portfolio
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      # app/static/admin.css is generated from css/input.css and the templates and committed. If someone changes a
      # template and forgets scripts/build_css.sh, the committed file is stale and this fails.
      - name: The committed admin stylesheet matches the templates
        run: |
          sh scripts/build_css.sh
          git diff --exit-code -- app/static/admin.css

  web:
    name: Web types and build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The TypeScript types come from the API's OpenAPI file. If the file changed and the types were not regenerated, fail.
      - name: api-types.ts matches openapi.json
        run: |
          npm run api:types
          git diff --exit-code -- api-types.ts
      - run: npx tsc --noEmit
      - run: npm run build
      - name: Known vulnerabilities in what runs in production
        run: npm audit --omit=dev --audit-level=high

  images:
    name: Docker images build
    needs: [api, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build --tag portfolio-api ./api
      - run: docker build --tag portfolio-web ./web
