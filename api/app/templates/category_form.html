{% extends "base.html" %}
{% block title %}{% if row %}แก้ไขประเภท{% else %}เพิ่มประเภท{% endif %}{% endblock %}
{% block content %}
<h1>{% if row %}แก้ไขประเภท{% else %}เพิ่มประเภท{% endif %}</h1>
<form method="post" action="{% if row %}/categories/{{ row.id }}{% else %}/categories{% endif %}" style="max-width: 420px">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label for="name_th">ชื่อภาษาไทย</label>
  <input id="name_th" name="name_th" type="text" value="{{ row.name_th if row else '' }}">
  <label for="name_en">ชื่อภาษาอังกฤษ</label>
  <input id="name_en" name="name_en" type="text" value="{{ row.name_en if row else '' }}">
  <p class="muted">กรอกได้ทีละภาษา ช่องที่ยังว่างจะมีป้ายเตือนในรายการ และหน้าเว็บจะแสดงอีกภาษาแทน</p>
  <p><button>บันทึก</button> <a href="/categories">ยกเลิก</a></p>
</form>
{% endblock %}
