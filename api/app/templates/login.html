{% extends "base.html" %}
{% set hide_nav = true %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<h1>เข้าสู่ระบบ</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" hx-boost="false" style="max-width: 360px">
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <label for="email">อีเมล</label>
  <input id="email" name="email" type="email" autocomplete="username" required>
  <label for="password">รหัสผ่าน</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <label for="code">รหัส TOTP 6 หลัก</label>
  <input id="code" name="code" type="text" inputmode="numeric" autocomplete="one-time-code">
  <p><button>เข้าสู่ระบบ</button></p>
</form>
{% if github %}
<p><a class="btn" href="/login/github" hx-boost="false">เข้าสู่ระบบด้วย GitHub</a></p>
{% endif %}
{% endblock %}
